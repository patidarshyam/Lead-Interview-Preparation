<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="1200" height="900" fill="#0f1117"/>

  <!-- Title -->
  <rect x="20" y="10" width="1160" height="50" rx="8" fill="#20232a"/>
  <text x="600" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#61dafb">⚛ React &amp; Frontend — Interview Cheatsheet</text>

  <!-- ── COLUMN 1 ── -->

  <!-- Hooks -->
  <rect x="20" y="72" width="370" height="220" rx="8" fill="#1a1d23" stroke="#61dafb" stroke-width="1.5"/>
  <rect x="20" y="72" width="370" height="32" rx="8" fill="#61dafb"/>
  <text x="205" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f1117">HOOKS</text>
  <text x="35" y="120" font-size="11" fill="#e6e6e6">useState    — local state (form, toggle, UI)</text>
  <text x="35" y="138" font-size="11" fill="#e6e6e6">useEffect   — side effects, API calls, cleanup</text>
  <text x="35" y="156" font-size="11" fill="#e6e6e6">useContext  — global data, no prop drilling</text>
  <text x="35" y="174" font-size="11" fill="#e6e6e6">useMemo     — memoize expensive computations</text>
  <text x="35" y="192" font-size="11" fill="#e6e6e6">useCallback — memoize functions (stable refs)</text>
  <text x="35" y="210" font-size="11" fill="#e6e6e6">useRef      — DOM access, persist values</text>
  <text x="35" y="228" font-size="11" fill="#e6e6e6">useReducer  — complex state transitions</text>
  <text x="35" y="252" font-size="11" fill="#fbbf24">Rules: Top-level only · No conditions/loops · React fns only</text>
  <text x="35" y="270" font-size="11" fill="#fbbf24">Deps: [] once · [val] on change · omit every render</text>

  <!-- Virtual DOM -->
  <rect x="20" y="304" width="370" height="165" rx="8" fill="#1a1d23" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="20" y="304" width="370" height="32" rx="8" fill="#a78bfa"/>
  <text x="205" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f1117">VIRTUAL DOM</text>
  <text x="35" y="352" font-size="11" fill="#e6e6e6">JSX → Virtual DOM tree (in-memory JS object)</text>
  <text x="35" y="370" font-size="11" fill="#e6e6e6">State change → New VDOM created</text>
  <text x="35" y="388" font-size="11" fill="#e6e6e6">Diff (reconciliation) vs previous VDOM</text>
  <text x="35" y="406" font-size="11" fill="#e6e6e6">Patch only changed real DOM nodes</text>
  <text x="35" y="430" font-size="11" fill="#fbbf24">key prop → stable list identity during diffing</text>
  <text x="35" y="448" font-size="11" fill="#fbbf24">React 18: concurrent rendering + batching</text>

  <!-- Lifecycle -->
  <rect x="20" y="481" width="370" height="175" rx="8" fill="#1a1d23" stroke="#34d399" stroke-width="1.5"/>
  <rect x="20" y="481" width="370" height="32" rx="8" fill="#34d399"/>
  <text x="205" y="502" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f1117">COMPONENT LIFECYCLE (Hooks)</text>
  <text x="35" y="529" font-size="11" fill="#e6e6e6">Mount:   useEffect(() =&gt; {}, [])   — runs once</text>
  <text x="35" y="547" font-size="11" fill="#e6e6e6">Update:  useEffect(() =&gt; {}, [dep]) — on dep change</text>
  <text x="35" y="565" font-size="11" fill="#e6e6e6">Unmount: return () =&gt; cleanup()   — cleanup fn</text>
  <text x="35" y="589" font-size="11" fill="#fbbf24">AbortController → cancel fetch on unmount</text>
  <text x="35" y="607" font-size="11" fill="#fbbf24">clearInterval() → clear timers on unmount</text>
  <text x="35" y="625" font-size="11" fill="#fbbf24">StrictMode runs effects twice (dev) to test cleanup</text>
  <text x="35" y="643" font-size="11" fill="#f87171">Stale closure: use setCount(prev =&gt; prev+1)</text>

  <!-- ── COLUMN 2 ── -->

  <!-- State Management -->
  <rect x="410" y="72" width="380" height="215" rx="8" fill="#1a1d23" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="410" y="72" width="380" height="32" rx="8" fill="#f59e0b"/>
  <text x="600" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f1117">STATE MANAGEMENT</text>
  <text x="425" y="120" font-size="11" fill="#e6e6e6">useState     → local UI state (default choice)</text>
  <text x="425" y="138" font-size="11" fill="#e6e6e6">Lifted state → share between siblings via parent</text>
  <text x="425" y="156" font-size="11" fill="#e6e6e6">Context API  → low-freq global (auth, theme, locale)</text>
  <text x="425" y="174" font-size="11" fill="#e6e6e6">Redux/Zustand → complex, high-freq global state</text>
  <text x="425" y="192" font-size="11" fill="#e6e6e6">React Query/SWR → server state, caching, sync</text>
  <text x="425" y="216" font-size="11" fill="#fbbf24">Context re-renders ALL consumers on change</text>
  <text x="425" y="234" font-size="11" fill="#fbbf24">Redux useSelector → selective component updates</text>
  <text x="425" y="268" font-size="11" fill="#60a5fa">Rule: local → lift → context → Redux (in that order)</text>

  <!-- Context vs Redux -->
  <rect x="410" y="299" width="380" height="175" rx="8" fill="#1a1d23" stroke="#f472b6" stroke-width="1.5"/>
  <rect x="410" y="299" width="380" height="32" rx="8" fill="#f472b6"/>
  <text x="600" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f1117">CONTEXT vs REDUX</text>
  <text x="425" y="348" font-size="11" fill="#a3e635" font-weight="bold">Context                Redux Toolkit</text>
  <text x="425" y="366" font-size="11" fill="#e6e6e6">Built-in               External library</text>
  <text x="425" y="384" font-size="11" fill="#e6e6e6">Re-renders all         Selective (useSelector)</text>
  <text x="425" y="402" font-size="11" fill="#e6e6e6">No devtools            Time-travel debug</text>
  <text x="425" y="420" font-size="11" fill="#e6e6e6">Manual async           Thunk / Saga middleware</text>
  <text x="425" y="438" font-size="11" fill="#e6e6e6">auth / theme / i18n    Cart, orders, dashboard</text>
  <text x="425" y="460" font-size="11" fill="#fbbf24">Redux Toolkit eliminates action-creator boilerplate</text>

  <!-- Controlled vs Uncontrolled -->
  <rect x="410" y="486" width="380" height="170" rx="8" fill="#1a1d23" stroke="#34d399" stroke-width="1.5"/>
  <rect x="410" y="486" width="380" height="32" rx="8" fill="#34d399"/>
  <text x="600" y="507" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f1117">CONTROLLED vs UNCONTROLLED</text>
  <text x="425" y="534" font-size="11" fill="#a3e635" font-weight="bold">Controlled             Uncontrolled</text>
  <text x="425" y="552" font-size="11" fill="#e6e6e6">React state owns val   DOM owns val (useRef)</text>
  <text x="425" y="570" font-size="11" fill="#e6e6e6">Real-time validation   On-submit only</text>
  <text x="425" y="588" font-size="11" fill="#e6e6e6">More boilerplate       Simpler</text>
  <text x="425" y="606" font-size="11" fill="#e6e6e6">Forms with logic       File inputs, 3rd-party libs</text>
  <text x="425" y="630" font-size="11" fill="#fbbf24">React Hook Form / Formik for large forms</text>

  <!-- ── COLUMN 3 ── -->

  <!-- Performance -->
  <rect x="810" y="72" width="370" height="215" rx="8" fill="#1a1d23" stroke="#fb923c" stroke-width="1.5"/>
  <rect x="810" y="72" width="370" height="32" rx="8" fill="#fb923c"/>
  <text x="995" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f1117">PERFORMANCE OPTIMIZATION</text>
  <text x="825" y="120" font-size="11" fill="#e6e6e6">React.memo()    — skip re-render if props same</text>
  <text x="825" y="138" font-size="11" fill="#e6e6e6">useMemo         — memoize derived/computed data</text>
  <text x="825" y="156" font-size="11" fill="#e6e6e6">useCallback     — stable fn ref for child props</text>
  <text x="825" y="174" font-size="11" fill="#e6e6e6">React.lazy()    — route-level code splitting</text>
  <text x="825" y="192" font-size="11" fill="#e6e6e6">react-window    — virtualize long lists</text>
  <text x="825" y="210" font-size="11" fill="#e6e6e6">useTransition   — non-urgent update scheduling</text>
  <text x="825" y="234" font-size="11" fill="#fbbf24">Pair React.memo + useCallback (stable callbacks)</text>
  <text x="825" y="252" font-size="11" fill="#f87171">Don't over-memoize: measure first, then optimize</text>
  <text x="825" y="270" font-size="11" fill="#fbbf24">Bundle: tree-shaking · webpack-bundle-analyzer</text>

  <!-- Auth Flow -->
  <rect x="810" y="299" width="370" height="180" rx="8" fill="#1a1d23" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="810" y="299" width="370" height="32" rx="8" fill="#818cf8"/>
  <text x="995" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f1117">AUTH FLOW (SPA)</text>
  <text x="825" y="348" font-size="11" fill="#e6e6e6">1. Check token (localStorage/cookie) on load</text>
  <text x="825" y="366" font-size="11" fill="#e6e6e6">2. No token → redirect to OAuth/OIDC provider</text>
  <text x="825" y="384" font-size="11" fill="#e6e6e6">3. Auth code → exchange for access+refresh token</text>
  <text x="825" y="402" font-size="11" fill="#e6e6e6">4. Axios interceptor: attach Bearer token to reqs</text>
  <text x="825" y="420" font-size="11" fill="#e6e6e6">5. 401 → refresh token → retry silently</text>
  <text x="825" y="444" font-size="11" fill="#fbbf24">httpOnly cookies &gt; localStorage (XSS safe)</text>
  <text x="825" y="462" font-size="11" fill="#fbbf24">PrivateRoute component → guards protected routes</text>

  <!-- Routing -->
  <rect x="810" y="491" width="370" height="165" rx="8" fill="#1a1d23" stroke="#2dd4bf" stroke-width="1.5"/>
  <rect x="810" y="491" width="370" height="32" rx="8" fill="#2dd4bf"/>
  <text x="995" y="512" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f1117">REACT ROUTER</text>
  <text x="825" y="539" font-size="11" fill="#e6e6e6">BrowserRouter → Routes → Route path=".."</text>
  <text x="825" y="557" font-size="11" fill="#e6e6e6">useNavigate()      — programmatic navigation</text>
  <text x="825" y="575" font-size="11" fill="#e6e6e6">useParams()        — path params (:id)</text>
  <text x="825" y="593" font-size="11" fill="#e6e6e6">useSearchParams()  — query strings</text>
  <text x="825" y="611" font-size="11" fill="#e6e6e6">useLocation()      — current URL info</text>
  <text x="825" y="635" font-size="11" fill="#fbbf24">Outlet → render child routes in parent</text>
  <text x="825" y="653" font-size="11" fill="#fbbf24">* wildcard route → must be last</text>

  <!-- ── BOTTOM BANNER ── -->
  <rect x="20" y="668" width="1160" height="90" rx="8" fill="#1a1d23" stroke="#61dafb" stroke-width="1"/>
  <text x="600" y="690" text-anchor="middle" font-size="12" font-weight="bold" fill="#61dafb">JSX RULES &amp; COMMON PITFALLS</text>
  <text x="40" y="712" font-size="11" fill="#e6e6e6">JSX compiles to React.createElement() · Single root element · className not class · htmlFor not for · Expressions in {}</text>
  <text x="40" y="730" font-size="11" fill="#f87171">Pitfalls: missing useEffect deps → stale closure · over-using memo → complexity · hooks in conditions → broken order</text>
  <text x="40" y="748" font-size="11" fill="#fbbf24">useEffect infinite loop: missing dep array runs every render · fix: add [] or correct deps</text>

  <!-- Footer -->
  <rect x="20" y="770" width="1160" height="32" rx="8" fill="#20232a"/>
  <text x="600" y="791" text-anchor="middle" font-size="11" fill="#6b7280">React 16.8+ Hooks · React 18 Concurrent · React Router v6 · Redux Toolkit · React Query</text>

</svg>
